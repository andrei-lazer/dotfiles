# r refreshes my tmux config
unbind r
bind r source-file ~/.config/tmux/tmux.conf


# colours
set -g default-terminal "xterm-ghostty"
set -as terminal-features ",*:RGB"
# zsh shell
set-option -g default-shell /bin/zsh

set -g prefix C-a
set -g mouse on

# act like vim
set -g mode-keys vi

set-option -g history-limit 10000

set -s escape-time 0
set -g status-interval 3

# start numbers from 1
set -g base-index 1
setw -g pane-base-index 1


FG_COLOR="white"
BG_COLOR="default"
ACCENT_COLOR="red"
MONITOR_STRING=" : #{cpu}  : #{mem}"

# status bar
set -g status-style bg=${BG_COLOR},fg=${FG_COLOR}
set -g status-right "${MONITOR_STRING}" # add 󰏤 symbol when prefix has been pressed
set -g status-left-length 20
set -g status-left "#S #{?client_prefix,󰏤,}"
set-option -g status-position top

# window buttons
set -g status-justify absolute-centre
set -g window-status-format "•"
set -g window-status-current-format "▼"
set -g renumber-windows on

# colours
set -g mode-style bg=${ACCENT_COLOR},fg=${FG_COLOR}

# keybinds
bind-key b set-option status # prefix+b disables status bar
unbind t
bind-key -r t run-shell "tmux neww ~/.local/scripts/time-manager"
unbind f
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
unbind h
bind-key -r h run-shell 'tmux neww "~/.local/bin/cht.sh --shell"'
unbind g
bind-key -r g popup -E -w 90% -h 90% "lazygit"

bind-key s choose-tree -Zs -O name


# aesthetics
set -g pane-border-lines simple
set -g pane-border-style fg=black
set -g pane-active-border-style fg=color242

# List of plugins
set -g @plugin 'tmux-plugins/tpm' # package manager
set -g @plugin 'nhdaly/tmux-better-mouse-mode' # makes scrolling 100x better
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible' # a few slightly different key bindings
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# plugin settings
set -g @scroll-speed-num-lines-per-scroll "1"

run '~/.tmux/plugins/tpm/tpm'
